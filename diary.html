<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nhật Ký Của Tụi Mình</title>
<meta name="robots" content="noindex, nofollow" />
<script>
// same "tb_theme" key as index.html/admin.html — one choice, shared everywhere
(function(){
  var saved = localStorage.getItem("tb_theme");
  if(saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
})();
</script>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2784/2784539.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f6f0ec;--card:#fffefc;--paper:#fbf5f0;--ink:#3a322e;--soft:#6b5f58;--faint:#9c8f86;
  --line:rgba(58,50,46,.10);--line-2:rgba(58,50,46,.18);
  --accent:#c98a76;--accent-deep:#b16b56;--accent-wash:rgba(201,138,118,.13);
  --stamp:#b5544a;--stamp-wash:rgba(181,84,74,.09);
  --good:#6f9166;--good-wash:rgba(111,145,102,.12);
  --me:#b16b56;--me-wash:rgba(177,107,86,.1);
  --partner:#a2678f;--partner-wash:rgba(162,103,143,.1);
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  /* fixed across both themes — solid button/pill fills with white text
     stay legible even though --accent-deep/--stamp go lighter in dark mode */
  --accent-solid:#c98a76;--stamp-solid:#b5544a;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#211d1a;--card:#2a2521;--paper:#262220;--ink:#ede7de;--soft:#c4bbae;--faint:#8f8578;
    --line:rgba(237,231,222,.10);--line-2:rgba(237,231,222,.18);
    --accent:#d19b73;--accent-deep:#e0ab82;--accent-wash:rgba(209,155,115,.16);
    --stamp:#e0776a;--stamp-wash:rgba(224,119,106,.14);
    --good:#8fb37f;--good-wash:rgba(143,179,127,.14);
    --me:#e0ab82;--me-wash:rgba(224,171,130,.14);
    --partner:#d492bb;--partner-wash:rgba(212,146,187,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#211d1a;--card:#2a2521;--paper:#262220;--ink:#ede7de;--soft:#c4bbae;--faint:#8f8578;
  --line:rgba(237,231,222,.10);--line-2:rgba(237,231,222,.18);
  --accent:#d19b73;--accent-deep:#e0ab82;--accent-wash:rgba(209,155,115,.16);
  --stamp:#e0776a;--stamp-wash:rgba(224,119,106,.14);
  --good:#8fb37f;--good-wash:rgba(143,179,127,.14);
  --me:#e0ab82;--me-wash:rgba(224,171,130,.14);
  --partner:#d492bb;--partner-wash:rgba(212,146,187,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100dvh}
a{color:var(--accent-deep)}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:10px;
  background:var(--paper);color:var(--ink);font-size:1rem;
}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
textarea{resize:vertical;min-height:90px;font-family:var(--serif);font-size:1rem;line-height:1.6}
label{display:block;font-size:.8rem;font-weight:600;color:var(--soft);margin-bottom:6px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button{cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.9rem}
.btn-primary{background:var(--accent-solid);color:#fff;width:100%;padding:13px;font-size:.98rem;box-shadow:0 8px 20px -8px rgba(177,107,86,.5)}
.btn-primary:hover{background:var(--stamp-solid)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-del{background:transparent;color:var(--faint);padding:3px 8px;font-size:.72rem;border:1px solid var(--line-2);border-radius:7px}
.btn-del:hover{background:var(--stamp-wash);color:var(--stamp);border-color:var(--stamp-wash)}
@media(max-width:480px){.btn-del{padding:7px 11px;font-size:.78rem}}
.btn-secondary{background:var(--paper);color:var(--soft);padding:9px 16px;font-size:.82rem;border:1.5px solid var(--line-2);border-radius:10px}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn-secondary:disabled{opacity:.6;cursor:default}

/* pin gate — matches the rest of the site */
.pin-gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.pin-gate[hidden]{display:none}
.pin-card{width:100%;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 26px 60px -30px rgba(80,62,42,.42);padding:32px 26px;text-align:center}
.pin-input{width:100%;text-align:center;font-family:var(--mono);font-size:1.3rem;letter-spacing:.4em;padding:12px;margin:18px 0 10px;border-radius:10px}
.pin-error{font-family:var(--mono);font-size:11px;color:var(--stamp);min-height:14px;margin-bottom:10px}

.shell{max-width:880px;margin:0 auto;padding:36px 18px 90px}
.shell[hidden]{display:none}
@media(max-width:480px){.shell{padding:22px 14px 84px}}
.topbar{margin-bottom:26px;text-align:center;position:relative}
/* leaves a gutter around the centered title so it can't wrap under the
   absolutely-positioned theme button on narrow phones */
@media(max-width:480px){.topbar{margin-bottom:18px;padding:0 44px}.topbar h1{font-size:1.4rem}.topbar p{font-size:.88rem}}
.theme-toggle{
  position:absolute;top:0;right:0;
  flex:none;width:36px;height:36px;padding:0;border-radius:50%;
  display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--line-2);color:var(--soft);
  transition:border-color .2s,color .2s,transform .15s;
}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent-deep)}
.theme-toggle:active{transform:scale(.9)}
.theme-toggle svg{width:16px;height:16px}
.theme-toggle .icon-moon{display:none}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:none}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:block}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none}
  :root:not([data-theme="light"]) .theme-toggle .icon-moon{display:block}
}
.topbar h1{font-size:1.7rem}
.topbar p{font-family:var(--serif);font-style:italic;color:var(--soft);margin-top:6px;font-size:1rem}
.topbar-links{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.back-link{
  display:inline-block;font-size:.82rem;text-decoration:none;color:var(--faint);
  background:none;border:none;padding:0;font-weight:400;
}
.back-link:hover{color:var(--accent-deep)}
.back-link:disabled{opacity:.6;cursor:default}

.status-msg{font-size:.88rem;padding:12px 14px;border-radius:10px;margin-bottom:16px;font-weight:600;text-align:center}
.status-msg.ok{background:var(--good-wash);color:var(--good)}
.status-msg.err{background:var(--stamp-wash);color:var(--stamp)}
.status-msg[hidden]{display:none}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin-bottom:24px;box-shadow:0 16px 40px -28px rgba(80,62,42,.3)}

/* ── collapsible "write new" panel — closed by default so the tab opens
   straight onto the entries/memories instead of a tall form ── */
.write-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--paper);border:1.5px dashed var(--line-2);color:var(--accent-deep);
  padding:13px;border-radius:12px;font-family:var(--serif);font-size:.98rem;font-weight:600;
  margin-bottom:20px;
  transition:border-color .15s,background .15s;
}
.write-toggle:hover{border-color:var(--accent);background:var(--accent-wash)}
.write-toggle svg{width:16px;height:16px;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.write-toggle.open svg{transform:rotate(45deg)}

/* grows/fades open instead of snapping — JS sets an explicit max-height
   (measured from scrollHeight) so this transitions reliably everywhere,
   unlike animating straight to "auto" which browsers can't tween */
.write-panel-wrap{
  max-height:0;margin-top:0;opacity:0;overflow:hidden;visibility:hidden;
  transition:max-height .35s cubic-bezier(.2,.7,.2,1),
             margin-top .35s cubic-bezier(.2,.7,.2,1),
             opacity .2s ease,
             visibility 0s linear .35s;
}
.write-panel-wrap.open{
  margin-top:16px;opacity:1;visibility:visible;
  transition:max-height .4s cubic-bezier(.2,.7,.2,1),
             margin-top .4s cubic-bezier(.2,.7,.2,1),
             opacity .3s ease .06s,
             visibility 0s linear 0s;
}
@media(prefers-reduced-motion:reduce){
  .write-panel-wrap,.write-panel-wrap.open{transition:none}
  .write-toggle svg{transition:none}
}

/* ── tabs: Nhật Ký / Kỷ Niệm Chung, so the page isn't one long scroll ── */
.tab-bar{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tab-btn{
  padding:10px 6px;margin-bottom:-1px;
  font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--faint);
  border-bottom:2px solid transparent;
}
.tab-btn:hover{color:var(--soft)}
.tab-btn.active{color:var(--accent-deep);border-bottom-color:var(--accent-deep)}
@media(min-width:420px){.tab-btn{padding:10px 14px}}
.tab-panel[hidden]{display:none}

/* ── compact "lọc theo ngày" toolbar, replaces a whole heavy panel ── */
.diary-toolbar{margin-bottom:18px}
.entry-search{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1.5px solid var(--line-2);border-radius:99px;
  padding:9px 14px;margin-bottom:10px;
  transition:border-color .2s,box-shadow .2s;
}
.entry-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.entry-search svg{width:14px;height:14px;color:var(--faint);flex:none}
.entry-search input{border:none;background:none;padding:0;width:100%;font-size:.9rem}
.entry-search input:focus{box-shadow:none}
.date-filter-toggle{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.82rem;color:var(--faint);padding:4px 2px;
}
.date-filter-toggle:hover{color:var(--accent-deep)}
.date-filter-toggle svg{width:15px;height:15px}
.date-filter-fields{
  display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;
}
.date-filter-fields input{
  width:auto;flex:1;min-width:130px;padding:7px 10px;font-size:.82rem;border-radius:8px;
}
@media(max-width:360px){.date-filter-fields input{min-width:110px}}
.date-filter-fields span{color:var(--faint);font-size:.82rem}
.date-filter-fields button{
  flex:none;width:32px;height:32px;padding:0;border-radius:50%;
  display:grid;place-items:center;background:var(--paper);border:1px solid var(--line-2);
  color:var(--faint);font-size:.8rem;
}
.date-filter-fields button:hover{color:var(--stamp);border-color:var(--stamp-wash)}
@media(max-width:480px){.date-filter-fields button{width:36px;height:36px}}

/* ── who's writing ── */
.who-row{display:flex;gap:10px;margin-bottom:16px}
.who-btn{
  flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--paper);
  font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--soft);
  transition:all .15s;
}
.who-btn[data-who="me"].active{border-color:var(--me);background:var(--me-wash);color:var(--me)}
.who-btn[data-who="partner"].active{border-color:var(--partner);background:var(--partner-wash);color:var(--partner)}

/* ── mood picker ── */
.mood-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.mood-pill{
  padding:6px 13px;border-radius:99px;border:1.5px solid var(--line-2);background:var(--paper);
  font-size:.82rem;font-weight:500;color:var(--soft);transition:all .15s;
}
.mood-pill.active{color:#fff;border-color:transparent}
.mood-pill[data-mood="vui"].active{background:#7a9a5f}
.mood-pill[data-mood="buon"].active{background:#6c86a8}
.mood-pill[data-mood="nho"].active{background:var(--accent-solid)}
.mood-pill[data-mood="yeu"].active{background:#c4577e}
.mood-pill[data-mood="gian"].active{background:var(--stamp-solid)}
.mood-pill[data-mood="binh-yen"].active{background:#5f9088}

/* ── two journals side by side on desktop; on a narrow screen a
   side-by-side pair just means scrolling through all of one person's
   entries before reaching the other's, so it collapses into one
   chronological feed instead, color-coded per author ── */
.journals{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.journals-mobile{display:none}
@media(max-width:640px){
  .journals{display:none}
  .journals-mobile{display:block}
}
.entry-author{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.entry-author[data-who="me"]{color:var(--me)}
.entry-author[data-who="partner"]{color:var(--partner)}
.journals-mobile .entry{border-left-width:3px}
.journals-mobile .entry[data-author="me"]{border-left-color:var(--me)}
.journals-mobile .entry[data-author="partner"]{border-left-color:var(--partner)}
.journal-col h2{font-size:1.05rem;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.journal-col[data-who="me"] h2{border-bottom-color:var(--me);color:var(--me)}
.journal-col[data-who="partner"] h2{border-bottom-color:var(--partner);color:var(--partner)}
.entry-list{display:flex;flex-direction:column;gap:12px}
.entry{
  background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:4px 12px 12px 4px;
  padding:14px 15px 14px 17px;position:relative;
  box-shadow:0 10px 22px -16px rgba(80,62,42,.4);
  transition:box-shadow .2s,transform .2s;
}
.entry:hover{box-shadow:0 14px 28px -16px rgba(80,62,42,.5);transform:translateY(-1px)}
.journal-col[data-who="me"] .entry{border-left-color:var(--me)}
.journal-col[data-who="partner"] .entry{border-left-color:var(--partner)}
.entry-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.entry-tags{display:inline-flex;align-items:center;gap:8px}
.entry-mood{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);
}
.entry-mood .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.entry-mood[data-mood="vui"] .dot{background:#7a9a5f}
.entry-mood[data-mood="buon"] .dot{background:#6c86a8}
.entry-mood[data-mood="nho"] .dot{background:var(--accent-deep)}
.entry-mood[data-mood="yeu"] .dot{background:#c4577e}
.entry-mood[data-mood="gian"] .dot{background:var(--stamp)}
.entry-mood[data-mood="binh-yen"] .dot{background:#5f9088}
.entry-title{font-family:var(--serif);font-size:1.02rem;font-weight:600;margin-bottom:4px}
.entry-content{font-family:var(--serif);font-size:.94rem;line-height:1.65;color:var(--ink);white-space:pre-wrap}
.entry-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line-2)}
.entry-when{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.entry-actions{display:flex;gap:6px;align-items:center;flex:none}
.entry-like{
  flex:none;width:26px;height:26px;padding:0;display:grid;place-items:center;border-radius:50%;
  color:var(--faint);transition:color .2s,transform .15s;
}
.entry-like svg{width:14px;height:14px}
@media(max-width:480px){.entry-like{width:34px;height:34px}.entry-like svg{width:16px;height:16px}}
.entry-like:hover{color:var(--stamp)}
.entry-like.active{color:var(--stamp)}
.entry-like.active svg{fill:currentColor}
.entry-like:active{transform:scale(.85)}
.like-wrap{display:inline-flex;align-items:center;gap:3px}
.like-count{
  font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);
  min-width:12px;text-align:left;
}
.entry-more{
  display:inline-block;margin-top:6px;
  font-size:.8rem;font-weight:600;color:var(--accent-deep);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;
}
.entry-more:hover{color:var(--stamp)}
.entry-edit-form textarea,.memory-edit-form textarea{min-height:70px}
.entry-edit-actions{display:flex;gap:8px;margin-top:8px}
.entry-edit-actions button{flex:1;padding:8px;font-size:.8rem}
.empty-note{font-size:.84rem;color:var(--faint);text-align:center;padding:24px 10px;font-style:italic;font-family:var(--serif)}

/* ── shared memories timeline ── */
.memory-timeline{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.memory-card{
  background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;
  box-shadow:0 10px 22px -16px rgba(80,62,42,.4);
  transition:box-shadow .2s,transform .2s;
}
.memory-card:hover{box-shadow:0 14px 28px -16px rgba(80,62,42,.5);transform:translateY(-1px)}
.memory-date{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.memory-title{font-family:var(--serif);font-size:1.05rem;font-weight:600;margin-top:2px}
.memory-desc{font-size:.86rem;color:var(--soft);margin-top:6px;line-height:1.55;white-space:pre-wrap}
.memory-foot{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:8px}
.memory-foot .btn-del{height:26px;display:inline-flex;align-items:center}
@media(max-width:480px){.memory-foot .btn-del{height:32px}}

/* full-width media on top — same treatment for a photo or a YouTube
   thumbnail, so the feed doesn't mix two different card shapes */
.memory-media{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  margin-bottom:12px;background:var(--line-2);
}
.memory-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.memory-media.memory-video{cursor:pointer;background:#000}
.memory-media.memory-video:hover img{transform:scale(1.03)}
.memory-media .play-btn{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(20,14,10,.28);transition:background .2s;
}
.memory-media.memory-video:hover .play-btn{background:rgba(20,14,10,.42)}
.memory-media .play-btn svg{width:25px;height:25px;fill:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.memory-media .play-circle{
  width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);
  display:grid;place-items:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  border:1.5px solid rgba(255,255,255,.5);
}
.memory-media iframe{width:100%;height:100%;border:0;display:block}

/* ── print: strip the app chrome down to just the writing — text-first
   fine print for reading on a phone becomes plain body copy on paper ── */
@media print{
  .pin-gate,.theme-toggle,.write-toggle,.write-panel-wrap,.tab-bar,
  .topbar-links,.status-msg,.entry-search,.date-filter-toggle,.date-filter-fields,
  .entry-actions,.like-wrap,#loadMoreBtn,.entry-more,.memory-foot .btn-del,
  .memory-media .play-btn{display:none!important}
  body{background:#fff;color:#000}
  .shell{padding:0;max-width:none}
  /* the side-by-side columns don't paginate well — print the same
     chronological single-file feed used on mobile, for both authors */
  .journals{display:none!important}
  .journals-mobile{display:block!important}
  .entry,.memory-card{
    background:#fff;border:1px solid #ccc;box-shadow:none;
    break-inside:avoid;page-break-inside:avoid;
  }
}
</style>
</head>
<body>

<div class="pin-gate" id="pinGate">
  <div class="pin-card">
    <h1 style="font-size:1.2rem">Chào</h1>
    <p style="font-family:var(--serif);font-style:italic;font-size:.88rem;color:var(--soft);margin-top:4px">Nhập mã bí mật để vào nhật ký nhé</p>
    <form id="pinForm" autocomplete="off">
      <input class="pin-input" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="••••••" required autofocus />
      <p class="pin-error" id="pinError"></p>

<script>
const API_BASE = "https://book-api.dangpham.id.vn/api";
const AUTH_TOKEN_KEY = "tb_token";
const AUTH_EXP_KEY = "tb_token_exp";
const WHO_KEY = "tb_diary_who";

// ── light/dark toggle — shares "tb_theme" with index.html/admin.html ──
(function(){
  const toggle = document.getElementById("themeToggle");
  function current(){
    const explicit = document.documentElement.getAttribute("data-theme");
    if(explicit) return explicit;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  toggle.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("tb_theme", next);
  });
})();

function getStoredToken(){
  const token = localStorage.getItem(AUTH_TOKEN_KEY);
  const exp = Number(localStorage.getItem(AUTH_EXP_KEY) || 0);
  if(!token || !exp || Date.now() >= exp) return null;
  return token;
}
function storeToken(token){
  localStorage.setItem(AUTH_TOKEN_KEY, token);
  try{
    const payload = JSON.parse(atob(token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    localStorage.setItem(AUTH_EXP_KEY, String((payload.exp || 0) * 1000));
  }catch{
    localStorage.setItem(AUTH_EXP_KEY, String(Date.now() + 24*60*60*1000));
  }
}
function clearToken(){
  localStorage.removeItem(AUTH_TOKEN_KEY);
  localStorage.removeItem(AUTH_EXP_KEY);
}
function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// cuts long text to a preview and trims to the last whole word — plain
// text swap on click, not a CSS clamp, so it can't fight float/layout
function truncateText(text, maxLen){
  const full = text || "";
  if(full.length <= maxLen) return { full, preview: full, isLong: false };
  const preview = full.slice(0, maxLen).replace(/\s+\S*$/, "") + "…";
  return { full, preview, isLong: true };
}
function timeAgo(iso){
  if(!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if(min < 1) return "vừa xong";
  if(min < 60) return `${min} phút trước`;
  const hr = Math.floor(min / 60);
  if(hr < 24) return `${hr} giờ trước`;
  const day = Math.floor(hr / 24);
  if(day === 1) return "hôm qua";
  if(day < 7) return `${day} ngày trước`;
  return `${Math.floor(day / 7)} tuần trước`;
}

const pinGateEl = document.getElementById("pinGate");
const pinFormEl = document.getElementById("pinForm");
const pinInputEl = document.getElementById("pinInput");
const pinErrorEl = document.getElementById("pinError");
const pinSubmitEl = document.getElementById("pinSubmit");
const shellEl = document.getElementById("shell");

function showGate(message){
  pinGateEl.hidden = false;
  shellEl.hidden = true;
  pinErrorEl.textContent = message || "";
  pinInputEl.value = "";
  setTimeout(() => pinInputEl.focus(), 50);
}
function hideGate(){
  pinGateEl.hidden = true;
  shellEl.hidden = false;
}

pinFormEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pin = pinInputEl.value.trim();
  if(!pin) return;
  pinSubmitEl.disabled = true;
  pinErrorEl.textContent = "";
  try{
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin }),
    });
    if(!res.ok) throw new Error(res.status === 401 ? "Sai mã rồi, thử lại nhé." : "Không kết nối được máy chủ.");
    const { accessToken } = await res.json();
    storeToken(accessToken);
    hideGate();
    boot();
  }catch(err){
    pinErrorEl.textContent = err.message;
  }finally{
    pinSubmitEl.disabled = false;
  }
});

async function api(path, options = {}){
  const token = getStoredToken();
  if(!token){ showGate(); throw new Error("no-token"); }
  const headers = options.headers instanceof Headers ? options.headers : new Headers(options.headers || {});
  headers.set("Authorization", `Bearer ${token}`);
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  if(res.status === 401){
    clearToken();
    showGate("Phiên đã hết hạn, nhập lại mã nhé.");
    throw new Error("unauthorized");
  }
  if(!res.ok){
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

function flash(message, kind){
  const el = document.getElementById("globalStatus");
  el.textContent = message;
  el.className = `status-msg ${kind}`;
  el.hidden = false;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.hidden = true; }, 4000);
}

async function copyTextToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    flash("Đã sao chép.", "ok");
  }catch{
    flash("Không sao chép được — trình duyệt chặn quyền clipboard.", "err");
  }
}

// ── who's writing right now ──
const whoMeBtn = document.getElementById("whoMeBtn");
const whoPartnerBtn = document.getElementById("whoPartnerBtn");
let currentWho = localStorage.getItem(WHO_KEY) || "me";

function setWho(who, opts){
  currentWho = who;
  localStorage.setItem(WHO_KEY, who);
  whoMeBtn.classList.toggle("active", who === "me");
  whoPartnerBtn.classList.toggle("active", who === "partner");
  // re-render hearts so "active" state reflects the newly-selected viewer —
  // skipped on the initial boot call since loadEntries/loadMemories run right after anyway
  if(!opts || !opts.silent){
    renderEntries();
    loadMemories();
  }
}
whoMeBtn.addEventListener("click", () => setWho("me"));
whoPartnerBtn.addEventListener("click", () => setWho("partner"));

// ── collapsible "write new" panels — closed on load so each tab opens
// straight onto the entries/memories instead of a tall form ──
function setupWriteToggle(toggleBtn, panelEl, labelEl, openLabel, closeLabel){
  toggleBtn.addEventListener("click", () => {
    const willOpen = !panelEl.classList.contains("open");
    if(willOpen){
      panelEl.classList.add("open");
      panelEl.style.maxHeight = panelEl.scrollHeight + "px";
    }else{
      // pin the current height first — a transition can't start from
      // "auto", it needs an explicit px value to animate down from
      panelEl.style.maxHeight = panelEl.scrollHeight + "px";
      panelEl.offsetHeight; // force layout so the browser registers that height before it changes
      panelEl.classList.remove("open");
      panelEl.style.maxHeight = "0px";
    }
    toggleBtn.classList.toggle("open", willOpen);
    toggleBtn.setAttribute("aria-expanded", String(willOpen));
    labelEl.textContent = willOpen ? closeLabel : openLabel;
  });
}
setupWriteToggle(
  document.getElementById("entryWriteToggle"),
  document.getElementById("entryWritePanel"),
  document.getElementById("entryWriteToggleLabel"),
  "Viết nhật ký mới", "Thu gọn",
);
setupWriteToggle(
  document.getElementById("memoryWriteToggle"),
  document.getElementById("memoryWritePanel"),
  document.getElementById("memoryWriteToggleLabel"),
  "Thêm kỷ niệm mới", "Thu gọn",
);
// used when restoring a draft — skips opening if the panel's tab isn't the
// active one, since a hidden ancestor means scrollHeight would measure 0
function openWritePanelIfClosed(toggleId, panelId){
  const panel = document.getElementById(panelId);
  if(panel.closest("[hidden]")) return;
  if(!panel.classList.contains("open")) document.getElementById(toggleId).click();
}

// ── mood picker (single select) ──
const moodRowEl = document.getElementById("moodRow");
let currentMood = null;
moodRowEl.addEventListener("click", (e) => {
  const pill = e.target.closest(".mood-pill");
  if(!pill) return;
  const mood = pill.dataset.mood;
  currentMood = currentMood === mood ? null : mood;
  moodRowEl.querySelectorAll(".mood-pill").forEach(p => p.classList.toggle("active", p.dataset.mood === currentMood));
  saveEntryDraft();
});

// ── draft auto-save — nobody wants to lose a half-written entry to an
// accidental refresh or a dropped connection on submit ──
const ENTRY_DRAFT_KEY = "tb_diary_draft";
const entryTitleEl = document.getElementById("entryTitle");
const entryContentEl = document.getElementById("entryContent");

function saveEntryDraft(){
  const title = entryTitleEl.value;
  const content = entryContentEl.value;
  if(!title && !content && !currentMood){
    localStorage.removeItem(ENTRY_DRAFT_KEY);
    return;
  }
  localStorage.setItem(ENTRY_DRAFT_KEY, JSON.stringify({ title, content, mood: currentMood }));
}
function restoreEntryDraft(){
  const raw = localStorage.getItem(ENTRY_DRAFT_KEY);
  if(!raw) return;
  try{
    const draft = JSON.parse(raw);
    if(draft.title) entryTitleEl.value = draft.title;
    if(draft.content) entryContentEl.value = draft.content;
    if(draft.mood){
      currentMood = draft.mood;
      moodRowEl.querySelectorAll(".mood-pill").forEach(p => p.classList.toggle("active", p.dataset.mood === currentMood));
    }
    if(draft.title || draft.content){
      flash("Đã khôi phục bản nháp nhật ký chưa gửi.", "ok");
      openWritePanelIfClosed("entryWriteToggle", "entryWritePanel");
    }
  }catch{
    localStorage.removeItem(ENTRY_DRAFT_KEY);
  }
}
entryTitleEl.addEventListener("input", saveEntryDraft);
entryContentEl.addEventListener("input", saveEntryDraft);

const MEMORY_DRAFT_KEY = "tb_memory_draft";
const memoryDraftFieldIds = ["memoryTitle", "memoryDate", "memoryDesc", "memoryPhoto", "memoryYoutube"];
function saveMemoryDraft(){
  const values = {};
  let hasContent = false;
  memoryDraftFieldIds.forEach(id => {
    const v = document.getElementById(id).value;
    values[id] = v;
    if(v) hasContent = true;
  });
  if(!hasContent){
    localStorage.removeItem(MEMORY_DRAFT_KEY);
    return;
  }
  localStorage.setItem(MEMORY_DRAFT_KEY, JSON.stringify(values));
}
function restoreMemoryDraft(){
  const raw = localStorage.getItem(MEMORY_DRAFT_KEY);
  if(!raw) return;
  try{
    const draft = JSON.parse(raw);
    let restoredAny = false;
    memoryDraftFieldIds.forEach(id => {
      if(draft[id]){ document.getElementById(id).value = draft[id]; restoredAny = true; }
    });
    if(restoredAny){
      flash("Đã khôi phục bản nháp kỷ niệm chưa gửi.", "ok");
      openWritePanelIfClosed("memoryWriteToggle", "memoryWritePanel");
    }
  }catch{
    localStorage.removeItem(MEMORY_DRAFT_KEY);
  }
}
memoryDraftFieldIds.forEach(id => {
  document.getElementById(id).addEventListener("input", saveMemoryDraft);
});

const MOOD_LABELS = { vui: "Vui", buon: "Buồn", nho: "Nhớ", yeu: "Yêu", gian: "Giận dỗi", "binh-yen": "Bình yên" };
let authorNames = { me: "Đăng", partner: "Vy" };

const ENTRY_PREVIEW_LEN = 420;

// shared by diary entries and memories — heart + a small count badge
// (0–2, since only "me"/"partner" can ever be in likedBy)
function likeButtonHTML(id, likedBy, dataAttr){
  const list = likedBy || [];
  const isLikedByMe = list.includes(currentWho);
  const count = list.length;
  return `
    <span class="like-wrap">
      <button type="button" class="entry-like${isLikedByMe ? " active" : ""}" ${dataAttr}="${id}" aria-label="${isLikedByMe ? "Bỏ tym" : "Tym"}">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
      </button>
      ${count > 0 ? `<span class="like-count">${count}</span>` : ""}
    </span>
  `;
}

function entryHTML(entry, opts){
  const canEdit = entry.author === currentWho;
  const showAuthor = opts && opts.showAuthor;
  const { full, preview, isLong } = truncateText(entry.content, ENTRY_PREVIEW_LEN);
  return `
    <div class="entry" data-entry-id="${entry.id}" data-author="${entry.author}">
      <div class="entry-head">
        <span class="entry-tags">
          ${showAuthor ? `<span class="entry-author" data-who="${entry.author}">${escapeHTML(authorNames[entry.author] || entry.author)}</span>` : ""}
          ${entry.mood ? `<span class="entry-mood" data-mood="${entry.mood}"><span class="dot"></span>${MOOD_LABELS[entry.mood] || entry.mood}</span>` : ""}
        </span>
        ${likeButtonHTML(entry.id, entry.likedBy, "data-like-entry")}
      </div>
      <div class="entry-view">
        ${entry.title ? `<div class="entry-title">${escapeHTML(entry.title)}</div>` : ""}
        <div class="entry-content" data-preview="${escapeHTML(preview)}" data-full="${escapeHTML(full)}">${escapeHTML(preview)}</div>
        ${isLong ? `<span class="entry-more" role="button" tabindex="0" data-more-entry data-expanded="0">Xem thêm</span>` : ""}
        <div class="entry-foot">
          <span class="entry-when">${timeAgo(entry.createdAt)}</span>
          <div class="entry-actions">
            <button type="button" class="btn-del" data-copy-entry="${entry.id}">Copy</button>
            ${canEdit ? `
              <button type="button" class="btn-del" data-edit-entry="${entry.id}">Sửa</button>
              <button type="button" class="btn-del" data-del-entry="${entry.id}">Xoá</button>
            ` : ""}
          </div>
        </div>
      </div>
    </div>
  `;
}

function entryEditFormHTML(entry){
  const moodPills = Object.entries(MOOD_LABELS)
    .map(([value, label]) => `<button type="button" class="mood-pill${entry.mood === value ? " active" : ""}" data-mood="${value}">${label}</button>`)
    .join("");
  return `
    <div class="entry-edit-form" data-edit-mood="${entry.mood || ""}">
      <div class="field">
        <input type="text" class="edit-title" placeholder="Tiêu đề (không bắt buộc)" value="${escapeHTML(entry.title || "")}" />
      </div>
      <div class="field">
        <textarea class="edit-content" required>${escapeHTML(entry.content)}</textarea>
      </div>
      <div class="mood-row">
        ${moodPills}
      </div>
      <div class="entry-edit-actions">
        <button type="button" class="btn-secondary" data-cancel-edit="${entry.id}">Huỷ</button>
        <button type="button" class="btn-primary" data-save-edit="${entry.id}" style="width:auto">Lưu</button>
      </div>
    </div>
  `;
}

const DIARY_PAGE_SIZE = 30;
let allEntries = [];
let diaryOffset = 0;
let diaryTotal = 0;

const entrySearchEl = document.getElementById("entrySearchInput");
const filterStartDateEl = document.getElementById("filterStartDate");
const filterEndDateEl = document.getElementById("filterEndDate");
const filterClearBtn = document.getElementById("filterClearBtn");
const loadMoreBtn = document.getElementById("loadMoreBtn");
const dateFilterToggle = document.getElementById("dateFilterToggle");
const dateFilterFields = document.getElementById("dateFilterFields");

function renderEntries(){
  const meList = document.getElementById("meEntryList");
  const partnerList = document.getElementById("partnerEntryList");
  const combinedList = document.getElementById("combinedEntryList");
  const meEntries = allEntries.filter(e => e.author === "me");
  const partnerEntries = allEntries.filter(e => e.author === "partner");
  const isFiltered = Boolean(entrySearchEl.value.trim() || filterStartDateEl.value || filterEndDateEl.value);
  const emptyNote = `<p class="empty-note">${isFiltered ? "Không tìm thấy gì khớp cả." : "Chưa có gì ở đây — viết vài dòng đầu tiên đi."}</p>`;
  meList.innerHTML = meEntries.length ? meEntries.map(e => entryHTML(e)).join("") : emptyNote;
  partnerList.innerHTML = partnerEntries.length ? partnerEntries.map(e => entryHTML(e)).join("") : emptyNote;
  // mobile-only: same entries as one chronological feed instead of two
  // columns, so reading doesn't mean scrolling past all of one person's
  // entries first — each card gets a name tag since there's no column
  // header to tell them apart anymore
  combinedList.innerHTML = allEntries.length
    ? allEntries.map(e => entryHTML(e, { showAuthor: true })).join("")
    : emptyNote;
  loadMoreBtn.style.display = allEntries.length < diaryTotal ? "" : "none";
}

function diaryQueryParams(offset){
  const params = new URLSearchParams({ limit: String(DIARY_PAGE_SIZE), offset: String(offset) });
  if(filterStartDateEl.value) params.set("startDate", filterStartDateEl.value);
  if(filterEndDateEl.value) params.set("endDate", filterEndDateEl.value);
  if(entrySearchEl.value.trim()) params.set("q", entrySearchEl.value.trim());
  return params.toString();
}

let entrySearchDebounce;
entrySearchEl.addEventListener("input", () => {
  clearTimeout(entrySearchDebounce);
  entrySearchDebounce = setTimeout(() => { loadEntries().catch(() => {}); }, 350);
});

// resets to the first page — used on initial load, after adding/deleting
// an entry, or when the date filter changes
async function loadEntries(){
  diaryOffset = 0;
  const res = await api(`/diary?${diaryQueryParams(0)}`);
  allEntries = res.items;
  diaryTotal = res.total;
  diaryOffset = res.items.length;
  renderEntries();
}

async function loadMoreEntries(){
  loadMoreBtn.disabled = true;
  loadMoreBtn.textContent = "Đang tải…";
  try{
    const res = await api(`/diary?${diaryQueryParams(diaryOffset)}`);
    allEntries = allEntries.concat(res.items);
    diaryTotal = res.total;
    diaryOffset += res.items.length;
    renderEntries();
  }catch(err){
    if(err.message !== "unauthorized") flash(err.message, "err");
  }finally{
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = "Tải thêm nhật ký cũ hơn";
  }
}
loadMoreBtn.addEventListener("click", loadMoreEntries);

function updateFilterClearVisibility(){
  filterClearBtn.hidden = !filterStartDateEl.value && !filterEndDateEl.value;
}

    }

    const likeBtn = e.target.closest("[data-like-entry]");

  if(!d) return "";

  const desc = truncateText(m.description || "", MEMORY_DESC_PREVIEW_LEN);

    ? memoryVideoHTML(m.youtubeId)
    : m.photoUrl
      ? `<div class="memory-media"><img src="${escapeHTML(m.photoUrl)}" alt="" loading="lazy" onerror="this.parentElement.remove()" /></div>`
      : "";
  return `
    <div class="memory-card" data-memory-id="${m.id}">
      ${mediaHTML}
      ${m.memoryDate ? `<div class="memory-date">${formatMemoryDate(m.memoryDate)}</div>` : ""}
      <div class="memory-title">${escapeHTML(m.title)}</div>
      ${m.description ? `<div class="memory-desc" data-preview="${escapeHTML(desc.preview)}" data-full="${escapeHTML(desc.full)}">${escapeHTML(desc.preview)}</div>` : ""}
      ${desc.isLong ? `<span class="entry-more" role="button" tabindex="0" data-more-memory-desc data-expanded="0">Xem thêm</span>` : ""}
      <div class="memory-foot">
        <button type="button" class="btn-del" data-copy-memory="${m.id}">Copy</button>
        ${likeButtonHTML(m.id, m.likedBy, "data-like-memory")}
        <button type="button" class="btn-del" data-edit-memory="${m.id}">Sửa</button>
        <button type="button" class="btn-del" data-del-memory="${m.id}">Xoá</button>

    </div>
  `;
}

// ── export everything to a plain-text file — theirs to keep, independent
// of whether they keep using the site ──
async function fetchAllEntriesForExport(){
  const all = [];
  let offset = 0;
  while(true){
    const res = await api(`/diary?limit=100&offset=${offset}`);
    all.push(...res.items);
    offset += res.items.length;
    if(res.items.length === 0 || offset >= res.total) break;
  }
  return all;
}

function buildExportText(entries, memories){
  const lines = ["NHẬT KÝ CỦA TỤI MÌNH", `Tải về lúc: ${new Date().toLocaleString("vi-VN")}`, ""];
  lines.push("========== NHẬT KÝ ==========", "");
  if(!entries.length) lines.push("(chưa có dòng nào)", "");
  [...entries].reverse().forEach(e => {
    const name = authorNames[e.author] || e.author;
    const when = new Date(e.createdAt).toLocaleString("vi-VN");
    const mood = e.mood ? ` · ${MOOD_LABELS[e.mood] || e.mood}` : "";
    lines.push(`[${name}] ${when}${mood}`);
    if(e.title) lines.push(e.title);
    lines.push(e.content, "", "---", "");
  });
  lines.push("========== KỶ NIỆM CHUNG ==========", "");
  if(!memories.length) lines.push("(chưa có kỷ niệm nào)", "");
  [...memories].reverse().forEach(m => {
    const when = m.memoryDate ? formatMemoryDate(m.memoryDate) : new Date(m.createdAt).toLocaleDateString("vi-VN");
    lines.push(`${when} — ${m.title}`);
    if(m.description) lines.push(m.description);
    if(m.photoUrl) lines.push(`Ảnh: ${m.photoUrl}`);
    if(m.youtubeId) lines.push(`Video: https://youtu.be/${m.youtubeId}`);
    lines.push("", "---", "");
  });
  return lines.join("\n");
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  const btn = document.getElementById("exportBtn");
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Đang chuẩn bị…";
  try{
    const [entries, memories] = await Promise.all([fetchAllEntriesForExport(), api("/memories")]);
    const text = buildExportText(entries, memories);
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `nhat-ky-va-ky-niem-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    if(err.message !== "unauthorized") flash(err.message, "err");
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

async function boot(){
  setWho(currentWho, { silent: true });
  restoreEntryDraft();
  restoreMemoryDraft();
  try{
    // names load first so the mobile combined feed's author tags are
    // correct on first paint, not the "Đăng/Vy" placeholder defaults
    await loadNames();
    await Promise.all([loadEntries(), loadMemories()]);
  }catch(err){
    if(err.message !== "unauthorized" && err.message !== "no-token") flash(err.message, "err");
  }
}

// print should show everything, not whatever's currently truncated behind
// a "Xem thêm" — expand it all beforehand, put it back after so the
// on-screen state (and anyone's "Thu gọn" click) isn't disturbed
window.addEventListener("beforeprint", () => {
  document.querySelectorAll(".entry-content[data-full], .memory-desc[data-full]").forEach(el => {
    el.dataset.printRestore = el.textContent === el.dataset.preview ? "1" : "0";
    el.textContent = el.dataset.full;
  });
});
window.addEventListener("afterprint", () => {
  document.querySelectorAll("[data-print-restore]").forEach(el => {
    if(el.dataset.printRestore === "1") el.textContent = el.dataset.preview;
    delete el.dataset.printRestore;
  });
});

if(getStoredToken()){
  hideGate();
  boot();
}else{
  showGate();
}
</script>
</body>
</html>
